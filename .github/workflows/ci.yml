name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://vboard_app:fake@localhost/fake"
          BETTER_AUTH_SECRET: "ci-secret"
          BETTER_AUTH_URL: "http://localhost:3000"

  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vboard
          POSTGRES_PASSWORD: vboard
          POSTGRES_DB: vboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://vboard_app:app-ci@localhost:5432/vboard"
      DIRECT_URL: "postgresql://vboard:vboard@localhost:5432/vboard"
      VBOARD_APP_PASSWORD: "app-ci"
      SUPER_ADMIN_EMAILS: "superadmin@vit.edu.in"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Provision restricted database principals
        run: npm run db:provision

      - name: Apply migrations
        run: npm run db:migrate

      - name: Applying them again changes nothing
        run: npm run db:migrate

      - name: Every migration file is recorded as applied
        run: npx tsx scripts/check-migrations.ts

      - name: Verify runtime privileges and database security
        run: npm run db:verify

      - name: Fresh and legacy migration and authorization tests
        run: npm run test:db
